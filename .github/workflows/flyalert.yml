name: Flyability alerts

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily (06:30 BST / 05:30 GMT)
  workflow_dispatch:        # "Run workflow" button for testing

permissions:
  contents: write           # to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python flyalert.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "flyalert"
          git config user.email "flyalert@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
